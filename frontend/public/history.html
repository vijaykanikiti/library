<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue History - LibraryMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkRole(["admin", "librarian", "student"]);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="body">
      <!-- Sidebar -->
      <aside class="side" id="sidebar"></aside>

      <!-- Main Content -->
      <main class="main" style="padding: 0;">
        <header class="topbar" id="topbar"></header>

        <div style="padding: 24px;">
          <!-- Page Header -->
          <div class="head" id="pageHeader">
            <div>
              <h2>Issue History</h2>
              <p>Complete history of borrowed and returned books</p>
            </div>
          </div>

          <!-- Filter & Search Controls -->
          <div class="box" style="padding: 16px; margin-bottom: 20px;">
            <div style="display: flex; gap: 14px; flex-wrap: wrap; align-items: center;">
              <div style="flex: 1; min-width: 220px;">
                <input type="text" id="historySearch" placeholder="Search by book title or member..." oninput="renderHistoryTable()" style="width: 100%; padding: 8px 12px; background: #0d1733; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none;">
              </div>
              <div style="min-width: 150px;">
                <select id="statusFilter" onchange="renderHistoryTable()" style="width: 100%; padding: 8px 12px; background: #0d1733; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none;">
                  <option value="">All Statuses</option>
                  <option value="Issued">Issued</option>
                  <option value="Returned">Returned</option>
                  <option value="Overdue">Overdue</option>
                </select>
              </div>
              <div>
                <span id="historyCount" style="font-size: 13px; color: var(--text-sub);">Showing 0 records</span>
              </div>
            </div>
          </div>

          <!-- History Table Box -->
          <div class="box">
            <div class="scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Book Title</th>
                    <th>Member</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Return Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    renderSidebar("history");
    renderTopbar("Issue History", "Complete history of borrowed and returned books");

    var currentUser = getUser();

    function renderHistoryTable() {
      var allIssues = getData("issues");
      var q = document.getElementById("historySearch").value.toLowerCase().trim();
      var st = document.getElementById("statusFilter").value;

      var filtered = [];
      for (var i = 0; i < allIssues.length; i++) {
        var it = allIssues[i];

        // If student, filter by student name
        if (currentUser && currentUser.role === "student") {
          if (it.memberName !== currentUser.name && it.memberId != currentUser.id) {
            continue;
          }
        }

        var matchQuery = (!q ||
          it.bookTitle.toLowerCase().indexOf(q) !== -1 ||
          it.memberName.toLowerCase().indexOf(q) !== -1
        );

        var matchStatus = (!st || it.status === st);

        if (matchQuery && matchStatus) {
          filtered.push(it);
        }
      }

      document.getElementById("historyCount").textContent = "Showing " + filtered.length + " records";

      var tbody = document.getElementById("historyTableBody");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-sub); padding: 28px;">No loan history records found.</td></tr>';
        return;
      }

      var html = "";
      for (var j = 0; j < filtered.length; j++) {
        var row = filtered[j];
        var tagColor = "blue";
        if (row.status === "Returned") tagColor = "green";
        else if (row.status === "Overdue") tagColor = "red";

        html +=
          '<tr>' +
            '<td>' + (j + 1) + '</td>' +
            '<td><strong>' + row.bookTitle + '</strong></td>' +
            '<td>' + row.memberName + '</td>' +
            '<td>' + row.issueDate + '</td>' +
            '<td>' + row.dueDate + '</td>' +
            '<td>' + (row.returnDate || "-") + '</td>' +
            '<td><span class="tag ' + tagColor + '">' + row.status + '</span></td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    renderHistoryTable();
  </script>
</body>
</html>
