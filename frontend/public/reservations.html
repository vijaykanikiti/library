<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations & Renewals - LibraryMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkRole(["admin", "librarian", "student"]);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="body">
      <!-- Sidebar -->
      <aside class="side" id="sidebar"></aside>

      <!-- Main Content -->
      <main class="main" style="padding: 0;">
        <header class="topbar" id="topbar"></header>

        <div style="padding: 24px;">
          <!-- Page Header -->
          <div class="head" id="pageHeader">
            <div>
              <h2>Reservations & Renewals</h2>
              <p>Manage book reservations and renewal requests</p>
            </div>
          </div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab active" id="tabResBtn" onclick="switchResTab('res')">Book Reservations</button>
            <button class="tab" id="tabRenewBtn" onclick="switchResTab('renew')">Active Renewals</button>
          </div>

          <!-- Tab 1: Reservations -->
          <div id="tabResContent">
            <div class="box">
              <div class="box-head">
                <h3>Current Book Reservations</h3>
                <span id="resCount" class="tag blue">0 Reservations</span>
              </div>
              <div class="scroll">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Book Title</th>
                      <th>Member</th>
                      <th>Reserved On</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="resTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Tab 2: Renewals -->
          <div id="tabRenewContent" style="display: none;">
            <div class="box">
              <div class="box-head">
                <h3>Loan Extensions & Renewals</h3>
                <span id="renewCount" class="tag orange">0 Active Loans</span>
              </div>
              <div class="scroll">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Book Title</th>
                      <th>Member</th>
                      <th>Issue Date</th>
                      <th>Due Date</th>
                      <th>Renewals</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="renewTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    renderSidebar("reservations");
    renderTopbar("Reservations & Renewals", "Manage book reservations and renewal requests");

    var currentUser = getUser();

    function switchResTab(tab) {
      if (tab === "res") {
        document.getElementById("tabResBtn").classList.add("active");
        document.getElementById("tabRenewBtn").classList.remove("active");
        document.getElementById("tabResContent").style.display = "block";
        document.getElementById("tabRenewContent").style.display = "none";
        renderReservations();
      } else {
        document.getElementById("tabRenewBtn").classList.add("active");
        document.getElementById("tabResBtn").classList.remove("active");
        document.getElementById("tabRenewContent").style.display = "block";
        document.getElementById("tabResContent").style.display = "none";
        renderRenewals();
      }
    }

    function renderReservations() {
      var allRes = getData("reservations");
      var filtered = [];

      for (var i = 0; i < allRes.length; i++) {
        var r = allRes[i];
        if (currentUser && currentUser.role === "student") {
          if (r.memberName !== currentUser.name && r.memberId != currentUser.id) {
            continue;
          }
        }
        filtered.push(r);
      }

      document.getElementById("resCount").textContent = filtered.length + " Reservations";

      var tbody = document.getElementById("resTableBody");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-sub); padding: 24px;">No reservations found.</td></tr>';
        return;
      }

      var html = "";
      for (var j = 0; j < filtered.length; j++) {
        var item = filtered[j];
        var tagColor = item.status === "Confirmed" ? "green" : "orange";

        var actions = '<button class="btn sm danger" onclick="cancelReservation(' + item.id + ')">Cancel</button>';
        if (currentUser && (currentUser.role === "admin" || currentUser.role === "librarian")) {
          if (item.status === "Waiting") {
            actions = '<button class="btn sm" style="margin-right: 6px;" onclick="confirmReservation(' + item.id + ')">Confirm</button>' + actions;
          }
        }

        html +=
          '<tr>' +
            '<td><strong>' + item.bookTitle + '</strong></td>' +
            '<td>' + item.memberName + '</td>' +
            '<td>' + item.date + '</td>' +
            '<td><span class="tag ' + tagColor + '">' + item.status + '</span></td>' +
            '<td>' + actions + '</td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    function cancelReservation(id) {
      if (!confirm("Are you sure you want to cancel this reservation?")) return;
      var allRes = getData("reservations");
      var updated = [];
      for (var i = 0; i < allRes.length; i++) {
        if (allRes[i].id != id) {
          updated.push(allRes[i]);
        }
      }
      saveData("reservations", updated);
      renderReservations();
    }

    function confirmReservation(id) {
      var allRes = getData("reservations");
      for (var i = 0; i < allRes.length; i++) {
        if (allRes[i].id == id) {
          allRes[i].status = "Confirmed";
          break;
        }
      }
      saveData("reservations", allRes);
      renderReservations();
    }

    function renderRenewals() {
      var allIssues = getData("issues");
      var filtered = [];

      for (var i = 0; i < allIssues.length; i++) {
        var it = allIssues[i];
        if (it.status === "Returned") continue;

        if (currentUser && currentUser.role === "student") {
          if (it.memberName !== currentUser.name && it.memberId != currentUser.id) {
            continue;
          }
        }
        filtered.push(it);
      }

      document.getElementById("renewCount").textContent = filtered.length + " Active Loans";

      var tbody = document.getElementById("renewTableBody");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-sub); padding: 24px;">No active loans eligible for renewal.</td></tr>';
        return;
      }

      var html = "";
      for (var j = 0; j < filtered.length; j++) {
        var row = filtered[j];
        var renewsDone = row.renewals || 0;
        var renewBtn = '';

        if (renewsDone >= 2) {
          renewBtn = '<button class="btn sm outline" disabled style="opacity: 0.5;">Limit Reached (2/2)</button>';
        } else {
          renewBtn = '<button class="btn sm" onclick="handleRenew(' + row.id + ')">Renew (+14 Days)</button>';
        }

        html +=
          '<tr>' +
            '<td><strong>' + row.bookTitle + '</strong></td>' +
            '<td>' + row.memberName + '</td>' +
            '<td>' + row.issueDate + '</td>' +
            '<td><strong>' + row.dueDate + '</strong></td>' +
            '<td><span class="tag ' + (renewsDone > 0 ? "orange" : "blue") + '">' + renewsDone + ' / 2</span></td>' +
            '<td>' + renewBtn + '</td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    function handleRenew(id) {
      var res = renewBook(id);
      if (res.ok) {
        alert("Loan extended successfully! New due date: " + res.dueDate);
        renderRenewals();
      } else {
        alert(res.msg);
      }
    }

    renderReservations();
  </script>
</body>
</html>
