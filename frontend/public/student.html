<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - LibraryMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkRole(["student", "admin"]);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="body">
      <!-- Sidebar -->
      <aside class="side" id="sidebar"></aside>

      <!-- Main Content -->
      <main class="main" style="padding: 0;">
        <header class="topbar" id="topbar"></header>

        <div style="padding: 24px;">
          <!-- Page Header -->
          <div class="head" id="pageHeader"></div>

          <!-- 4 Stat Cards -->
          <div class="grid">
            <div class="card blue">
              <h3>Borrowed Books</h3>
              <div class="num" id="statStuBorrowed">0</div>
              <div class="card-icon">📖</div>
            </div>
            <div class="card orange">
              <h3>Due This Week</h3>
              <div class="num" id="statStuDueSoon">0</div>
              <div class="card-icon">⏳</div>
            </div>
            <div class="card red">
              <h3>Overdue Books</h3>
              <div class="num" id="statStuOverdue">0</div>
              <div class="card-icon">⚠️</div>
            </div>
            <div class="card green">
              <h3>Outstanding Fines</h3>
              <div class="num" id="statStuFine">Rs. 0.00</div>
              <div class="card-icon">💰</div>
            </div>
          </div>

          <!-- Current Loans Table -->
          <div class="box">
            <div class="box-head">
              <h3>My Borrowed Books</h3>
              <a href="reservations.html" style="font-size: 12.5px;">Manage Loans & Renewals →</a>
            </div>
            <div class="scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Book Title</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="stuLoansBody"></tbody>
              </table>
            </div>
          </div>

          <!-- 2 Columns: My Reservations & Recommended Books -->
          <div class="row">
            <!-- Active Reservations Box -->
            <div class="box">
              <div class="box-head">
                <h3>My Active Reservations</h3>
                <a href="reservations.html" style="font-size: 12.5px;">View All →</a>
              </div>
              <ul class="list" id="stuResList"></ul>
            </div>

            <!-- Recommended Books Quick Links -->
            <div class="box">
              <div class="box-head">
                <h3>Recommended For You</h3>
                <a href="books.html" style="font-size: 12.5px;">Explore All Books →</a>
              </div>
              <ul class="list" id="stuRecList"></ul>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    renderSidebar("dashboard");
    var user = getUser();
    var welcomeSubtitle = "Welcome back, " + (user ? user.name : "Student");
    renderTopbar("Student Dashboard", welcomeSubtitle);

    function loadStudentDashboard() {
      var allIssues = getData("issues");
      var allRes = getData("reservations");
      var allBooks = getData("books");

      var myLoans = [];
      var overdueCount = 0;
      var dueSoonCount = 0;
      var totalFine = 0;
      var today = getToday();
      var todayD = new Date(today);

      for (var i = 0; i < allIssues.length; i++) {
        var it = allIssues[i];
        if (user && user.role === "student") {
          if (it.memberName !== user.name && it.memberId != user.id) {
            continue;
          }
        }

        if (it.status !== "Returned") {
          myLoans.push(it);

          var dueD = new Date(it.dueDate);
          var diff = Math.ceil((todayD.getTime() - dueD.getTime()) / (1000 * 60 * 60 * 24));

          if (diff > 0) {
            overdueCount++;
            totalFine += (diff * 5);
          } else if (diff >= -7) {
            dueSoonCount++;
          }
        }
      }

      document.getElementById("statStuBorrowed").textContent = myLoans.length;
      document.getElementById("statStuDueSoon").textContent = dueSoonCount;
      document.getElementById("statStuOverdue").textContent = overdueCount;
      document.getElementById("statStuFine").textContent = "Rs. " + totalFine.toFixed(2);

      // Render loans table
      var tbody = document.getElementById("stuLoansBody");
      if (myLoans.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-sub); padding: 24px;">No books currently borrowed. <a href="books.html">Browse catalog</a> to borrow books!</td></tr>';
      } else {
        var loanHtml = "";
        for (var j = 0; j < myLoans.length; j++) {
          var row = myLoans[j];
          var isLate = row.status === "Overdue" || (new Date(row.dueDate) < todayD);
          var tagColor = isLate ? "red" : "blue";
          var tagText = isLate ? "Overdue" : "Issued";

          loanHtml +=
            '<tr>' +
              '<td><strong>' + row.bookTitle + '</strong></td>' +
              '<td>' + row.issueDate + '</td>' +
              '<td><strong>' + row.dueDate + '</strong></td>' +
              '<td><span class="tag ' + tagColor + '">' + tagText + '</span></td>' +
              '<td><button class="btn sm" onclick="handleStudentRenew(' + row.id + ')">Renew (+14d)</button></td>' +
            '</tr>';
        }
        tbody.innerHTML = loanHtml;
      }

      // Render student reservations
      var resList = document.getElementById("stuResList");
      var myRes = [];
      for (var k = 0; k < allRes.length; k++) {
        var r = allRes[k];
        if (user && user.role === "student") {
          if (r.memberName !== user.name && r.memberId != user.id) {
            continue;
          }
        }
        myRes.push(r);
      }

      if (myRes.length === 0) {
        resList.innerHTML = '<li style="color: var(--text-sub); justify-content: center;">No active reservations.</li>';
      } else {
        var rHtml = "";
        for (var m = 0; m < myRes.length; m++) {
          var itm = myRes[m];
          var rTag = itm.status === "Confirmed" ? "green" : "orange";
          rHtml +=
            '<li>' +
              '<div class="list-info">' +
                '<div class="list-icon">🔖</div>' +
                '<div>' +
                  '<strong style="color: #fff; display: block;">' + itm.bookTitle + '</strong>' +
                  '<span style="font-size: 11.5px; color: var(--text-muted);">Reserved: ' + itm.date + '</span>' +
                '</div>' +
              '</div>' +
              '<span class="tag ' + rTag + '">' + itm.status + '</span>' +
            '</li>';
        }
        resList.innerHTML = rHtml;
      }

      // Recommended Books
      var recList = document.getElementById("stuRecList");
      var recHtml = "";
      for (var n = 0; n < Math.min(allBooks.length, 3); n++) {
        var b = allBooks[n];
        recHtml +=
          '<li>' +
            '<div class="list-info">' +
              '<div class="list-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--green);">📚</div>' +
              '<div>' +
                '<strong style="color: #fff; display: block;">' + b.title + '</strong>' +
                '<span style="font-size: 11.5px; color: var(--text-muted);">' + b.author + ' · ' + b.category + '</span>' +
              '</div>' +
            '</div>' +
            '<a href="book.html?id=' + b.id + '" class="btn sm outline">Details</a>' +
          '</li>';
      }
      recList.innerHTML = recHtml;
    }

    function handleStudentRenew(id) {
      var res = renewBook(id);
      if (res.ok) {
        alert("Loan renewed successfully! New due date: " + res.dueDate);
        loadStudentDashboard();
      } else {
        alert(res.msg);
      }
    }

    loadStudentDashboard();
  </script>
</body>
</html>
