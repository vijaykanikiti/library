<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details & Reviews - LibraryMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkRole(["admin", "librarian", "student"]);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="body">
      <!-- Sidebar -->
      <aside class="side" id="sidebar"></aside>

      <!-- Main Content -->
      <main class="main" style="padding: 0;">
        <header class="topbar" id="topbar"></header>

        <div style="padding: 24px;">
          <!-- Page Header -->
          <div class="head" id="pageHeader">
            <div>
              <h2>Book Details & Reviews</h2>
              <p>Ratings, reader reviews and book circulation information</p>
            </div>
            <div>
              <a href="books.html" class="btn outline sm">← Back to Catalog</a>
            </div>
          </div>

          <!-- Book Detail Box -->
          <div class="box" style="margin-bottom: 24px;">
            <div style="display: flex; gap: 24px; flex-wrap: wrap;">
              <!-- Large Book Cover Placeholder -->
              <div id="detailCover" style="width: 140px; height: 190px; border-radius: 10px; background: linear-gradient(135deg, #1e3a8a, #3b5bfd); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; text-align: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;">
                <span id="detailCoverTitle">Clean Code</span>
                <span id="detailCoverCat" style="font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 6px;">Technology</span>
              </div>

              <!-- Book Information -->
              <div style="flex: 1; min-width: 260px; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px;">
                    <h3 id="detailTitle" style="font-size: 22px; color: #fff;">Book Title</h3>
                    <span id="detailBadge" class="tag green">Available</span>
                  </div>
                  <div id="detailAuthor" style="font-size: 14px; color: var(--text-sub); margin-bottom: 10px;">by Author Name</div>
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px;">
                    <div class="stars" id="detailStars">★★★★★</div>
                    <span id="detailAvgRating" style="font-weight: 700; color: #fff;">4.8</span>
                    <span id="detailReviewCount" style="color: var(--text-muted); font-size: 12.5px;">(3 reviews)</span>
                  </div>
                  <div style="display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-sub);">
                    <div>ISBN: <strong id="detailIsbn" style="color: #fff;">978-0132350884</strong></div>
                    <div>Category: <strong id="detailCategory" style="color: #fff;">Computer Science</strong></div>
                    <div>Stock: <strong id="detailStock" style="color: #fff;">4 of 6 available</strong></div>
                  </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 18px;">
                  <button class="btn" onclick="openReviewModal()">★ Write a Review</button>
                  <button class="btn outline" id="reserveDetailBtn" onclick="handleDetailReserve()">Reserve This Book</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Reviews Section -->
          <div class="box">
            <div class="box-head">
              <h3>Reader Reviews & Ratings</h3>
              <button class="btn sm outline" onclick="openReviewModal()">+ Add Review</button>
            </div>
            <div class="list" id="reviewsList"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Write Review Modal -->
  <div class="modal" id="reviewModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="color: #fff; font-size: 18px;">Write a Review</h3>
        <button class="btn sm outline" onclick="closeReviewModal()" style="padding: 2px 8px;">✕</button>
      </div>
      <form class="form" onsubmit="handleReviewSubmit(event)">
        <div class="form-group">
          <label for="reviewRating">Your Rating</label>
          <select id="reviewRating" required>
            <option value="5">★★★★★ (5 Stars - Outstanding)</option>
            <option value="4">★★★★☆ (4 Stars - Very Good)</option>
            <option value="3">★★★☆☆ (3 Stars - Average)</option>
            <option value="2">★★☆☆☆ (2 Stars - Below Average)</option>
            <option value="1">★☆☆☆☆ (1 Star - Poor)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="reviewComment">Review Comment</label>
          <textarea id="reviewComment" rows="4" required placeholder="Share your thoughts about this book..."></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
          <button type="button" class="btn outline" onclick="closeReviewModal()">Cancel</button>
          <button type="submit" class="btn">Submit Review</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    renderSidebar("books");
    renderTopbar("Book Details & Reviews", "Ratings, reader reviews and book circulation information");

    var currentUser = getUser();
    var urlParams = new URLSearchParams(window.location.search);
    var bookId = parseInt(urlParams.get("id")) || 1;
    var currentBook = null;

    function loadBookDetails() {
      var allBooks = getData("books");
      for (var i = 0; i < allBooks.length; i++) {
        if (allBooks[i].id == bookId) {
          currentBook = allBooks[i];
          break;
        }
      }
      if (!currentBook && allBooks.length > 0) {
        currentBook = allBooks[0];
        bookId = currentBook.id;
      }

      if (!currentBook) return;

      document.getElementById("detailTitle").textContent = currentBook.title;
      document.getElementById("detailAuthor").textContent = "by " + currentBook.author;
      document.getElementById("detailIsbn").textContent = currentBook.isbn;
      document.getElementById("detailCategory").textContent = currentBook.category;
      document.getElementById("detailStock").textContent = currentBook.available + " of " + currentBook.total + " available";

      document.getElementById("detailCoverTitle").textContent = currentBook.title;
      document.getElementById("detailCoverCat").textContent = currentBook.category;
      document.getElementById("detailCover").style.background = currentBook.gradient || "linear-gradient(135deg, #1e3a8a, #3b5bfd)";

      var badge = document.getElementById("detailBadge");
      if (currentBook.available > 0) {
        badge.className = "tag green";
        badge.textContent = "Available";
      } else {
        badge.className = "tag red";
        badge.textContent = "Out of Stock";
      }

      renderReviews();
    }

    function renderReviews() {
      var allReviews = getData("reviews");
      var bookReviews = [];
      var totalStars = 0;

      for (var i = 0; i < allReviews.length; i++) {
        if (allReviews[i].bookId == bookId) {
          bookReviews.push(allReviews[i]);
          totalStars += allReviews[i].rating;
        }
      }

      var avgRating = bookReviews.length > 0 ? (totalStars / bookReviews.length).toFixed(1) : "0.0";
      var starStr = "";
      var rounded = Math.round(parseFloat(avgRating));
      for (var s = 0; s < 5; s++) {
        starStr += (s < rounded) ? "★" : "☆";
      }

      document.getElementById("detailStars").textContent = starStr;
      document.getElementById("detailAvgRating").textContent = avgRating;
      document.getElementById("detailReviewCount").textContent = "(" + bookReviews.length + " reviews)";

      var listEl = document.getElementById("reviewsList");
      if (bookReviews.length === 0) {
        listEl.innerHTML = '<div style="text-align: center; color: var(--text-sub); padding: 24px;">No reviews yet for this book. Be the first to write one!</div>';
        return;
      }

      var html = "";
      for (var j = 0; j < bookReviews.length; j++) {
        var r = bookReviews[j];
        var rStars = "";
        for (var k = 0; k < 5; k++) {
          rStars += (k < r.rating) ? "★" : "☆";
        }
        var initials = r.userName.split(" ").map(function(n) { return n[0]; }).join("").substring(0, 2);

        html +=
          '<div style="padding: 14px; background: #0d1733; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;">' +
            '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">' +
              '<div style="display: flex; align-items: center; gap: 10px;">' +
                '<div class="avatar" style="width: 30px; height: 30px; font-size: 11px;">' + initials + '</div>' +
                '<strong style="color: #fff; font-size: 13.5px;">' + r.userName + '</strong>' +
              '</div>' +
              '<div style="display: flex; align-items: center; gap: 8px;">' +
                '<span class="stars">' + rStars + '</span>' +
                '<span style="font-size: 11.5px; color: var(--text-muted);">' + (r.date || getToday()) + '</span>' +
              '</div>' +
            '</div>' +
            '<p style="color: var(--text-sub); font-size: 13px; line-height: 1.5; margin-left: 40px;">' + r.comment + '</p>' +
          '</div>';
      }
      listEl.innerHTML = html;
    }

    function openReviewModal() {
      document.getElementById("reviewModal").classList.add("open");
    }

    function closeReviewModal() {
      document.getElementById("reviewModal").classList.remove("open");
    }

    function handleReviewSubmit(e) {
      e.preventDefault();
      var rating = document.getElementById("reviewRating").value;
      var comment = document.getElementById("reviewComment").value.trim();

      var userName = currentUser ? currentUser.name : "Anonymous Reader";
      addReview(bookId, userName, rating, comment);

      closeReviewModal();
      document.getElementById("reviewComment").value = "";
      alert("Thank you! Your review has been added.");
      renderReviews();
    }

    function handleDetailReserve() {
      var memberId = 1;
      var res = reserveBook(bookId, memberId);
      if (res.ok) {
        alert("Reservation placed successfully!");
      } else {
        alert(res.msg);
      }
    }

    loadBookDetails();
  </script>
</body>
</html>
