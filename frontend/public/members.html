<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members Management - LibraryMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    checkRole(["admin", "librarian"]);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="body">
      <!-- Sidebar -->
      <aside class="side" id="sidebar"></aside>

      <!-- Main Content -->
      <main class="main" style="padding: 0;">
        <header class="topbar" id="topbar"></header>

        <div style="padding: 24px;">
          <!-- Page Header -->
          <div class="head" id="pageHeader">
            <div>
              <h2>Members Management</h2>
              <p>Add new member and manage library members</p>
            </div>
          </div>

          <!-- Add Member Form & Live Preview Row -->
          <div class="row" style="margin-bottom: 24px;">
            <!-- Form Box -->
            <div class="box">
              <div class="box-head">
                <h3>Add New Member</h3>
              </div>
              <form class="form" onsubmit="saveMember(event)">
                <div class="form-row">
                  <div class="form-group">
                    <label for="memCode">Member ID</label>
                    <div style="display: flex; gap: 8px;">
                      <input type="text" id="memCode" required placeholder="e.g. M1005" readonly style="background: #152248;">
                      <button type="button" class="btn sm outline" onclick="generateId()" style="white-space: nowrap;">Generate ID</button>
                    </div>
                  </div>
                  <div class="form-group">
                    <label for="memRole">Member Role</label>
                    <select id="memRole" onchange="updatePreview()">
                      <option value="Student">Student</option>
                      <option value="Faculty">Faculty</option>
                      <option value="Staff">Staff</option>
                    </select>
                  </div>
                </div>

                <div class="form-group">
                  <label for="memName">Full Name</label>
                  <input type="text" id="memName" required placeholder="Enter full name" oninput="updatePreview()">
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label for="memEmail">Email Address</label>
                    <input type="email" id="memEmail" required placeholder="name@example.com" oninput="updatePreview()">
                  </div>
                  <div class="form-group">
                    <label for="memPhone">Phone Number</label>
                    <input type="tel" id="memPhone" required placeholder="9876543210" oninput="updatePreview()">
                  </div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
                  <button type="button" class="btn outline" onclick="resetForm()">Cancel</button>
                  <button type="submit" class="btn">Save Member</button>
                </div>
              </form>
            </div>

            <!-- Member Live Preview Card -->
            <div class="box" style="display: flex; flex-direction: column; justify-content: center;">
              <div class="box-head">
                <h3>Live Member Preview</h3>
                <span class="tag green" id="previewStatus">Active</span>
              </div>
              <div class="preview-card">
                <div class="avatar" id="prevAvatar">--</div>
                <div class="preview-code" id="prevCode">M1005</div>
                <h3 id="prevName" style="color: #fff;">Member Name</h3>
                <span class="tag blue" id="prevRole" style="margin-bottom: 8px;">Student</span>
                <div style="font-size: 13px; color: var(--text-sub); display: flex; flex-direction: column; gap: 4px; width: 100%;">
                  <div>✉️ <span id="prevEmail">email@example.com</span></div>
                  <div>📞 <span id="prevPhone">+91 ----------</span></div>
                  <div>📅 Joined: <span id="prevJoin">Today</span></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Members Directory Table Box -->
          <div class="box">
            <div class="box-head">
              <h3>Members Directory</h3>
              <div style="min-width: 240px;">
                <input type="text" id="memberSearch" placeholder="Search members..." oninput="renderMembersTable()" style="width: 100%; padding: 6px 12px; background: #0d1733; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; outline: none;">
              </div>
            </div>
            <div class="scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th>Member ID</th>
                    <th>Full Name</th>
                    <th>Role</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Join Date</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="membersTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    renderSidebar("members");
    renderTopbar("Members Management", "Add new member and manage library members");

    function generateId() {
      var allMembers = getData("members");
      var maxNum = 1000;
      for (var i = 0; i < allMembers.length; i++) {
        var code = allMembers[i].code || "";
        var numPart = parseInt(code.replace(/\D/g, ""));
        if (!isNaN(numPart) && numPart > maxNum) {
          maxNum = numPart;
        }
      }
      var nextId = "M" + (maxNum + 1);
      document.getElementById("memCode").value = nextId;
      updatePreview();
      return nextId;
    }

    function updatePreview() {
      var name = document.getElementById("memName").value.trim() || "Member Name";
      var code = document.getElementById("memCode").value || "M1005";
      var role = document.getElementById("memRole").value;
      var email = document.getElementById("memEmail").value.trim() || "email@example.com";
      var phone = document.getElementById("memPhone").value.trim() || "+91 ----------";

      var initials = name.split(" ").map(function(n) { return n[0]; }).join("").substring(0, 2).toUpperCase() || "--";

      document.getElementById("prevAvatar").textContent = initials;
      document.getElementById("prevCode").textContent = code;
      document.getElementById("prevName").textContent = name;
      document.getElementById("prevRole").textContent = role;
      document.getElementById("prevEmail").textContent = email;
      document.getElementById("prevPhone").textContent = phone;
      document.getElementById("prevJoin").textContent = getToday();
    }

    function resetForm() {
      document.getElementById("memName").value = "";
      document.getElementById("memEmail").value = "";
      document.getElementById("memPhone").value = "";
      document.getElementById("memRole").value = "Student";
      generateId();
    }

    function saveMember(e) {
      e.preventDefault();
      var code = document.getElementById("memCode").value.trim();
      var name = document.getElementById("memName").value.trim();
      var email = document.getElementById("memEmail").value.trim();
      var phone = document.getElementById("memPhone").value.trim();
      var role = document.getElementById("memRole").value;

      var allMembers = getData("members");

      var newMem = {
        id: Date.now(),
        code: code,
        name: name,
        email: email,
        phone: phone,
        role: role,
        joinDate: getToday(),
        status: "Active"
      };

      allMembers.push(newMem);
      saveData("members", allMembers);

      var acts = getData("activities");
      acts.unshift({
        id: Date.now(),
        text: "Member registered: " + name,
        time: "Just now"
      });
      saveData("activities", acts);

      alert("Member registered successfully!");
      resetForm();
      renderMembersTable();
    }

    function deleteMember(id) {
      if (!confirm("Are you sure you want to remove this member?")) return;
      var allMembers = getData("members");
      var filtered = [];
      for (var i = 0; i < allMembers.length; i++) {
        if (allMembers[i].id != id) {
          filtered.push(allMembers[i]);
        }
      }
      saveData("members", filtered);
      renderMembersTable();
    }

    function renderMembersTable() {
      var allMembers = getData("members");
      var q = document.getElementById("memberSearch").value.toLowerCase().trim();

      var filtered = [];
      for (var i = 0; i < allMembers.length; i++) {
        var m = allMembers[i];
        if (!q ||
          m.name.toLowerCase().indexOf(q) !== -1 ||
          m.email.toLowerCase().indexOf(q) !== -1 ||
          (m.code && m.code.toLowerCase().indexOf(q) !== -1) ||
          (m.phone && m.phone.indexOf(q) !== -1)
        ) {
          filtered.push(m);
        }
      }

      var tbody = document.getElementById("membersTableBody");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-sub); padding: 24px;">No members found.</td></tr>';
        return;
      }

      var html = "";
      for (var j = 0; j < filtered.length; j++) {
        var mem = filtered[j];
        html +=
          '<tr>' +
            '<td><strong style="color: var(--primary);">' + (mem.code || "M" + mem.id) + '</strong></td>' +
            '<td><strong>' + mem.name + '</strong></td>' +
            '<td><span class="tag blue">' + mem.role + '</span></td>' +
            '<td>' + mem.email + '</td>' +
            '<td>' + (mem.phone || "-") + '</td>' +
            '<td>' + (mem.joinDate || getToday()) + '</td>' +
            '<td><span class="tag green">' + (mem.status || "Active") + '</span></td>' +
            '<td><button class="btn sm danger" onclick="deleteMember(' + mem.id + ')">Delete</button></td>' +
          '</tr>';
      }
      tbody.innerHTML = html;
    }

    generateId();
    renderMembersTable();
  </script>
</body>
</html>
